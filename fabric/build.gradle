plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'luckyblock-fabric'
}

repositories {
    mavenCentral()
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    // Simple loom for 26.2 - Mojang mappings, no split
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
        }
        resources {
            srcDir file('../common/src/main/resources')
        }
    }
}

dependencies {
    // Mixin for PackRepositoryMixin
    compileOnly "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
    annotationProcessor "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Common's dependencies are also needed for compilation when compiling common sources directly
    implementation "net.kyori:adventure-api:4.23.0"
    implementation "net.kyori:adventure-text-minimessage:4.23.0"
    implementation "net.kyori:adventure-text-serializer-gson:4.23.0"
    implementation "net.kyori:adventure-key:4.23.0"
    implementation "net.kyori:adventure-text-serializer-commons:4.23.0"
    implementation "net.kyori:adventure-text-serializer-json:4.23.0"
    implementation "net.kyori:option:1.1.0"
    implementation "net.kyori:examination-api:1.3.0"
    implementation "net.kyori:examination-string:1.3.0"

    // Fabric will bundle Kyori via include
    include implementation("net.kyori:adventure-text-minimessage:4.23.0")
    include implementation("net.kyori:adventure-text-serializer-gson:4.23.0")
    include implementation("net.kyori:adventure-api:4.23.0")
    include implementation("net.kyori:adventure-key:4.23.0")
    include implementation("net.kyori:adventure-text-serializer-commons:4.23.0")
    include implementation("net.kyori:adventure-text-serializer-json:4.23.0")
    include implementation("net.kyori:option:1.1.0")
    include implementation("net.kyori:examination-api:1.3.0")
    include implementation("net.kyori:examination-string:1.3.0")


}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    // Include common classes directly (loom will have already remapped common, but we bundle)
    // The `implementation project(':common')` adds it to classpath; to bundle we use from
    // This duplicates approach of include - but for fabric we want a single jar with both
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories { }
}
