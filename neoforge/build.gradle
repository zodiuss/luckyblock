plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

base {
    archivesName = 'luckyblock-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
        }
        resources {
            srcDir file('../common/src/main/resources')
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'lucky'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'lucky'
        }
        data {
            clientData()
            programArguments.addAll '--mod', 'lucky', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        'lucky' {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "net.kyori:adventure-api:4.23.0"
    implementation "net.kyori:adventure-text-minimessage:4.23.0"
    implementation "net.kyori:adventure-text-serializer-gson:4.23.0"
    implementation "net.kyori:adventure-key:4.23.0"
    implementation "net.kyori:adventure-text-serializer-commons:4.23.0"
    implementation "net.kyori:adventure-text-serializer-json:4.23.0"
    implementation "net.kyori:option:1.1.0"
    implementation "net.kyori:examination-api:1.3.0"
    implementation "net.kyori:examination-string:1.3.0"
}

afterEvaluate {
    if (configurations.findByName('jarJar') != null) {
        dependencies {
            jarJar "net.kyori:adventure-api:4.23.0"
            jarJar "net.kyori:adventure-text-minimessage:4.23.0"
            jarJar "net.kyori:adventure-text-serializer-gson:4.23.0"
            jarJar "net.kyori:adventure-key:4.23.0"
            jarJar "net.kyori:adventure-text-serializer-commons:4.23.0"
            jarJar "net.kyori:adventure-text-serializer-json:4.23.0"
            jarJar "net.kyori:option:1.1.0"
            jarJar "net.kyori:examination-api:1.3.0"
            jarJar "net.kyori:examination-string:1.3.0"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def version = project.version
    inputs.property "version", version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories { }
}
