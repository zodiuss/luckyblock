plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lucky" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	include implementation("net.kyori:adventure-text-minimessage:4.23.0")
	include implementation("net.kyori:adventure-text-serializer-gson:4.23.0")
	include implementation("net.kyori:adventure-api:4.23.0")
	include implementation("net.kyori:adventure-key:4.23.0")
	include implementation("net.kyori:adventure-text-serializer-commons:4.23.0")
	include implementation("net.kyori:adventure-text-serializer-json:4.23.0")
	include implementation("net.kyori:option:1.1.0")
	include implementation("net.kyori:examination-api:1.3.0")
	include implementation("net.kyori:examination-string:1.3.0")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
