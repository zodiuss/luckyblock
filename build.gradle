// Root project - no code, just aggregates
// Use `gradlew :fabric:build` or `gradlew :neoforge:build` to build a single loader
// `gradlew build` builds both

tasks.register("buildFabric") {
    group = "build"
    description = "Builds the Fabric jar"
    dependsOn(":fabric:build")
}

tasks.register("buildNeoForge") {
    group = "build"
    description = "Builds the NeoForge jar"
    dependsOn(":neoforge:build")
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds both Fabric and NeoForge jars"
    dependsOn(":fabric:build", ":neoforge:build")
}
