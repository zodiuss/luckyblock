plugins {
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    // Kyori only for IDE; Minecraft provided by loader modules
    implementation "net.kyori:adventure-api:4.23.0"
    implementation "net.kyori:adventure-text-minimessage:4.23.0"
    implementation "net.kyori:adventure-text-serializer-gson:4.23.0"
    implementation "net.kyori:adventure-key:4.23.0"
    implementation "net.kyori:adventure-text-serializer-commons:4.23.0"
    implementation "net.kyori:adventure-text-serializer-json:4.23.0"
    implementation "net.kyori:option:1.1.0"
    implementation "net.kyori:examination-api:1.3.0"
    implementation "net.kyori:examination-string:1.3.0"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Common is source-only; actual compilation happens in fabric/neoforge which include its sources
tasks.named('compileJava') { enabled = false }
tasks.named('processResources') { enabled = false }
tasks.named('jar') { enabled = false }

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories { }
}
